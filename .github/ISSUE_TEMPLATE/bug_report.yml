name: Bug report
description: Something the explainer did wrong, or failed to do
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked or ran, what you expected, and what you got.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, for example `explainer --resume 2`.
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and shell
      placeholder: macOS 26.6, zsh
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Output of transcript-tail.py --sources (optional)
      description: Remove anything private before pasting.
      render: text
